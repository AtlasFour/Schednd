<h2>Accedi a Schednd 🎲</h2>
<p>Il tuo codice di accesso è:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p>Inseriscilo nella pagina di accesso di Schednd, oppure tocca il pulsante:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:12px 20px;background:#6d28d9;color:#ffffff;border-radius:10px;text-decoration:none">Entra in Schednd</a></p>
<p style="color:#888;font-size:12px">Se non hai chiesto tu di accedere, ignora questa email.</p>
